# Build fixture only. Never install or start it.
# The address check is not ingress isolation; runtime firewall is a separate gate.
AddressFamily inet
Port 2224
ListenAddress 192.168.1.1
HostKey /etc/ssh/ssh_host_ed25519_key
UsePAM yes
UseDNS no
PermitRootLogin no
PermitEmptyPasswords no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication no
HostbasedAuthentication no
GSSAPIAuthentication no
DisableForwarding yes
PermitTTY no
PermitUserRC no
MaxAuthTries 3
LoginGraceTime 20
AllowUsers t6-enroll@192.168.1.50
ForceCommand /usr/local/libexec/terminal6-enroll-key

Match User t6-enroll Address 192.168.1.50
    PasswordAuthentication yes
    AuthenticationMethods password
