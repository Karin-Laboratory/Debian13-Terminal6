name: Public MT6990 NETSYS PHY PCS kernel patch replay
on:
  pull_request:
    paths:
      - 'scripts/apply-public-mt6990-kernel.py'
      - 'scripts/port-public-mt6990-pcs.py'
      - 'scripts/port-public-mt6990-ethernet.py'
      - 'scripts/port-public-mt6990-hwv.py'
      - 'scripts/port-public-mt6990-clock.py'
      - 'configs/public-mt6990-sources.json'
      - '.github/workflows/public-mt6990-network-replay.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-network:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Reuse pinned publicly redistributable texts
        run: |
          set -euo pipefail
          python3 scripts/stage-public-mt6990-sources.py --output "$RUNNER_TEMP/public-source"
      - name: Official Linux 6.18.63
        run: |
          set -euo pipefail
          git clone -q --depth 1 --branch v6.18.63 \
            https://github.com/gregkh/linux.git \
            "$RUNNER_TEMP/linux"
          test "$(git -C "$RUNNER_TEMP/linux" rev-parse HEAD)" = 1cdda838e8475edf89b73ff0cc952005dd0b1fa7
      - name: Replay MT6990 core plus Ethernet PHY PCS source patches
        run: |
          set -euo pipefail
          python3 scripts/apply-public-mt6990-kernel.py \
            --source-stage "$RUNNER_TEMP/public-source" \
            --kernel-tree "$RUNNER_TEMP/linux" \
            --scope network \
            --receipt "$RUNNER_TEMP/network-receipt.json"
          python3 scripts/port-public-mt6990-clock.py \
            "$RUNNER_TEMP/linux/drivers/clk/mediatek/clk-mt6990.c"
          python3 - "$RUNNER_TEMP/network-receipt.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert x["scope"]=="network"
          assert x["status"]=="PUBLIC_KERNEL_PATCHES_APPLIED_NOT_BUILT"
          assert len(x["patches"])==8
          print("PUBLIC_MT6990_NETSYS_PHY_PCS_SOURCE_REPLAY_PASS_NOT_HW_TESTED")
          PY
      - name: Cross compile MT6990 clock, NETSYS and LynxI PCS as real ARM64 objects
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -qq update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -y -qq install \
            gcc-aarch64-linux-gnu bc bison flex libssl-dev libelf-dev
          cd "$RUNNER_TEMP/linux"
          export ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-
          make -s defconfig
          scripts/config --disable HSR --enable IPV6
          scripts/config --enable ARCH_MEDIATEK --enable COMMON_CLK_MT6990 \
            --enable COMMON_CLK_MEDIATEK --enable NET_VENDOR_MEDIATEK \
            --enable NET_DSA --enable BRIDGE --enable NET_MEDIATEK_SOC \
            --enable PCS_MTK_LYNXI
          make -s olddefconfig prepare
          grep -E '^CONFIG_(ARCH_MEDIATEK|NET|NETDEVICES|NET_DSA|HSR|BRIDGE|IPV6|NET_VENDOR_MEDIATEK|NET_MEDIATEK_SOC|COMMON_CLK_MEDIATEK|COMMON_CLK_MT6990|PCS_MTK_LYNXI)=' .config || :
          grep -qx 'CONFIG_NET_MEDIATEK_SOC=y' .config
          grep -qx 'CONFIG_COMMON_CLK_MT6990=y' .config
          make -j4 drivers/clk/mediatek/clk-mt6990.o \
            drivers/clk/mediatek/clk-mt6990-ifrao.o \
            drivers/net/ethernet/mediatek/mtk_eth_soc.o \
            drivers/net/pcs/pcs-mtk-lynxi.o
          echo "PUBLIC_MT6990_CLOCK_NETSYS_PCS_ARM64_OBJECTS_COMPILED_NOT_HW_VALIDATED"
      # No binary artifacts, no signing, no physical device write.
