name: Public Terminal6 lean kernel and unsigned P25 research
on:
  push:
    branches:
      - codex/public-p25-terminal6-lean-20261116
    paths:
      - .github/workflows/terminal6-lean-p25.yml
      - scripts/build-linux-6.18.sh
      - scripts/make-initramfs.sh
      - scripts/configure-terminal6-lean.sh
      - scripts/verify-kconfig.py
      - tests/test_terminal6_lean_config.py
      - scripts/assemble-template-free-p25.py
      - scripts/verify-public-unsigned-p25.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: terminal6-lean-p25-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lean:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify lean contract before expensive compile
        run: python3 -m unittest discover -s tests -p 'test_terminal6_lean_config.py' -v
      - name: Install public ARM64 build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq flex bison libssl-dev libelf-dev bc \
            device-tree-compiler busybox-static cpio
          test "$(uname -m)" = aarch64
      - name: Prepare public source-only DTB, P44 initramfs, MT6990 stage
        run: |
          set -euo pipefail
          TERMINAL6_REPRODUCIBLE_INITRAMFS=1 SOURCE_DATE_EPOCH=0 \
            bash scripts/make-initramfs.sh /bin/busybox "$RUNNER_TEMP/p44-lean-initramfs.cpio.gz"
          TERMINAL6_REPRODUCIBLE_INITRAMFS=1 SOURCE_DATE_EPOCH=0 \
            bash scripts/make-initramfs.sh /bin/busybox "$RUNNER_TEMP/p44-lean-initramfs-repeat.cpio.gz"
          cmp "$RUNNER_TEMP/p44-lean-initramfs.cpio.gz" "$RUNNER_TEMP/p44-lean-initramfs-repeat.cpio.gz"
          sha256sum "$RUNNER_TEMP/p44-lean-initramfs.cpio.gz"
          echo "P44_INITRAMFS_REPRODUCIBLE_BYTES_PASS"
          bash scripts/stage-experimental-dtb.sh "$RUNNER_TEMP/lean-dtb"
          python3 scripts/stage-public-mt6990-sources.py --output "$RUNNER_TEMP/lean-public-stage"
      - name: Compile lean Linux 6.18.63 and save local same-build modules
        shell: bash
        env:
          KERNEL_PROFILE: terminal6-lean
          PUBLIC_MT6990_SCOPE: network
          JOBS: 4
        run: |
          set -euo pipefail
          export PUBLIC_MT6990_STAGE="$RUNNER_TEMP/lean-public-stage"
          export WORKDIR="$RUNNER_TEMP/lean-linux"
          export INITRAMFS_ARCHIVE="$RUNNER_TEMP/p44-lean-initramfs.cpio.gz"
          export DTB_PATH="$RUNNER_TEMP/lean-dtb/board/terminal6-debian-ethernet-experimental.dtb"
          if ! bash scripts/build-linux-6.18.sh > "$RUNNER_TEMP/lean-compile.log" 2>&1; then
            echo 'LEAN_KERNEL_BUILD_FAIL (last 160 lines, nonsecret)'
            tail -160 "$RUNNER_TEMP/lean-compile.log"
            exit 1
          fi
          grep -E 'DEBIAN_T6_|TERMINAL6_LEAN_|PUBLIC_MT6990_' "$RUNNER_TEMP/lean-compile.log" | tail -35
          wc -c "$WORKDIR/output/Image" "$WORKDIR/output/Image.gz" "$WORKDIR/output/terminal6-lean-modules.tar"
          cat "$WORKDIR/output/SHA256SUMS"
          cat "$WORKDIR/output/vmlinux-size.txt"
      - name: Manufacture and independently validate unsigned 32MiB P25
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/assemble-template-free-p25.py \
            --source-stage "$RUNNER_TEMP/lean-public-stage" \
            --profile "$GITHUB_WORKSPACE/configs/public-air6-boot-v2-profile.json" \
            --kernel-image "$RUNNER_TEMP/lean-linux/output/Image" \
            --initramfs-cpio-gz "$RUNNER_TEMP/p44-lean-initramfs.cpio.gz" \
            --dtb "$RUNNER_TEMP/lean-dtb/board/terminal6-debian-ethernet-experimental.dtb" \
            --output "$RUNNER_TEMP/lean-p25"
          python3 scripts/verify-public-unsigned-p25.py \
            --p25 "$RUNNER_TEMP/lean-p25/p25-unsigned.img" \
            --kernel-image "$RUNNER_TEMP/lean-linux/output/Image" \
            --initramfs-cpio-gz "$RUNNER_TEMP/p44-lean-initramfs.cpio.gz" \
            --dtb "$RUNNER_TEMP/lean-dtb/board/terminal6-debian-ethernet-experimental.dtb" \
            --profile "$GITHUB_WORKSPACE/configs/public-air6-boot-v2-profile.json" \
            --receipt "$RUNNER_TEMP/lean-p25/p25-receipt.json"
          test "$(stat -c %s "$RUNNER_TEMP/lean-p25/p25-unsigned.img")" = 33554432
          sha256sum "$RUNNER_TEMP/lean-p25/p25-unsigned.img"
          printf '%s\n' 'PUBLIC_LEAN_UNSIGNED_P25_32M_READBACK_PASS' \
            'NOT_SIGNED' 'LK_NOT_TESTED' 'C_UNIT_BOOT_NOT_TESTED'
      # Intentionally never upload binary artifacts from the public repository.
      # A matching private owner-only replay is required for artifact retention.
