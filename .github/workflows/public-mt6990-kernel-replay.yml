name: Public MT6990 Linux 6.18.63 source replay
on:
  pull_request:
    paths:
      - 'scripts/apply-public-mt6990-kernel.py'
      - 'scripts/stage-public-mt6990-sources.py'
      - 'configs/public-mt6990-sources.json'
      - '.github/workflows/public-mt6990-kernel-replay.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-kernel-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Fetch public SHA-pinned MT6990 texts
        run: |
          set -euo pipefail
          python3 scripts/stage-public-mt6990-sources.py --output "$RUNNER_TEMP/donor"
      - name: Fetch official Linux 6.18.63 stable source
        run: |
          set -euo pipefail
          git clone -q --depth 1 --branch v6.18.63 \
            https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git \
            "$RUNNER_TEMP/linux-6.18.63"
          test "$(make -s -C "$RUNNER_TEMP/linux-6.18.63" kernelversion)" = 6.18.63
      - name: Replay public MT6990 SoC clocks and eMMC source only
        run: |
          set -euo pipefail
          python3 scripts/apply-public-mt6990-kernel.py \
            --source-stage "$RUNNER_TEMP/donor" \
            --kernel-tree "$RUNNER_TEMP/linux-6.18.63" \
            --scope core \
            --receipt "$RUNNER_TEMP/core-source-receipt.json"
          python3 - "$RUNNER_TEMP/core-source-receipt.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d["status"] == "PUBLIC_KERNEL_PATCHES_APPLIED_NOT_BUILT"
          assert len(d["patches"]) == 3
          print("PUBLIC_MT6990_CORE_SOURCE_REPLAY_PASS")
          PY
      # Build and device hardware validation remain separately gated.
