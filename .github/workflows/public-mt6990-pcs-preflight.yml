name: Public MT6990 PCS dependency preflight
on:
  push:
    branches: [feat/public-p25-input-replacement-20261116]
    paths:
      - '.github/workflows/public-mt6990-pcs-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Reproduce public Linux 6.18.63 PCS patch dependency chain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pcs"; cd "$RUNNER_TEMP/pcs"
          git init -q
          stable="https://raw.githubusercontent.com/gregkh/linux/1cdda838e8475edf89b73ff0cc952005dd0b1fa7"
          upstream="https://raw.githubusercontent.com/13179415360/openwrt-mt6990-lg6851f/a40df9a5afb46716dea799acea69f17480df4d82"
          for file in drivers/net/pcs/pcs-mtk-lynxi.c drivers/net/ethernet/mediatek/mtk_eth_soc.c drivers/net/dsa/mt7530-mdio.c include/linux/pcs/pcs-mtk-lynxi.h; do
            mkdir -p "$(dirname "$file")"
            curl -fsSL --retry 3 --max-time 75 "$stable/$file" -o "$file"
          done
          git add .
          git -c user.name=CI -c user.email=ci@example.invalid commit -qm initial-stable-pcs
          fetch_pin() {
            local path="$1" blob="$2" out="$3"
            curl -fsSL --retry 3 --max-time 75 "$upstream/$path" -o "$out"
            test "$(git hash-object "$out")" = "$blob" || { echo "SOURCE_BLOB_MISMATCH: $path"; exit 1; }
          }
          fetch_pin target/linux/generic/pending-6.18/739-03-net-pcs-pcs-mtk-lynxi-add-platform-driver-for-MT7988.patch 7093797af7c4ea04b714fdd4b2729d9a7c0016fe /tmp/pcs739.patch
          fetch_pin target/linux/generic/backport-6.18/785-v7.0-09-net-pcs-pcs-mtk-lynxi-pass-SGMIISYS-OF-node-to-PCS.patch 9d88ac8af8c1a2750508459953f5f06560a9a804 /tmp/pcs785.patch
          fetch_pin target/linux/mediatek/patches-6.18/974-net-pcs-mtk-lynxi-add-mt6990-variant.patch "$(curl -fsSL https://api.github.com/repos/13179415360/openwrt-mt6990-lg6851f/contents/target/linux/mediatek/patches-6.18/974-net-pcs-mtk-lynxi-add-mt6990-variant.patch?ref=a40df9a5afb46716dea799acea69f17480df4d82 | python3 -c 'import json,sys;print(json.load(sys.stdin)["sha"])')" /tmp/pcs974.patch
          for pair in '739:/tmp/pcs739.patch' '785:/tmp/pcs785.patch' '974:/tmp/pcs974.patch'; do
            name="${pair%%:*}"; f="${pair#*:}"
            echo "::group::PATCH_${name}"
            git apply --recount --check "$f"
            git apply --recount "$f"
            echo "PUBLIC_PCS_PATCH_${name}_APPLIED"
            echo "::endgroup::"
          done
          echo PUBLIC_PCS_DEPENDENCY_CHAIN_SOURCE_PASS_NOT_COMPILED
